services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mystery-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_ORIGIN: http://localhost:8080
      MONGODB_URI: mongodb://mongo:27017/ai_mystery_room
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: http://localhost:5000/api/v1
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
volumes:
  mystery-data:
